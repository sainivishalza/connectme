name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}  # the whole history, not just the last commit
      - name: gitleaks (full history; values are redacted in the output)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --redact --no-banner --log-opts="--all"
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      mailhog:
        image: mailhog/mailhog:latest
        ports: ["1025:1025", "8025:8025"]
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ["12111:12111"]
      livekit:
        image: livekit/livekit-server:latest
        env:
          LIVEKIT_KEYS: "devkey: ci-livekit-secret-at-least-32-bytes!!"
        ports: ["7880:7880"]
    env:
      TEST_POSTGRES_URL: postgres://ci:ci@localhost:5432/ci?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379
      TEST_MONGO_URL: mongodb://localhost:27017/ci
      TEST_SMTP_HOST: 127.0.0.1
      TEST_SMTP_PORT: "1025"
      TEST_MAILHOG_API: http://127.0.0.1:8025
      TEST_STRIPE_MOCK_URL: http://127.0.0.1:12111
      TEST_LIVEKIT_URL: ws://127.0.0.1:7880
      TEST_LIVEKIT_SECRET: ci-livekit-secret-at-least-32-bytes!!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version-file: backend/go.mod}
      - run: cd backend && go vet ./... && go test -race -p 1 ./... -count=1
      - name: Known-vulnerability scan (fails if our code reaches a vulnerable symbol)
        run: cd backend && go install golang.org/x/vuln/cmd/govulncheck@v1.9.0 && $(go env GOPATH)/bin/govulncheck ./...
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: cd ai-service && pip install -r requirements.txt pytest pip-audit && pytest -q
      - run: cd ai-service && pip-audit -r requirements.txt
  realtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22}
      - run: cd realtime && npm ci && npm test
      - run: cd realtime && npm audit --omit=dev
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: {channel: stable}
      - run: cd mobile && flutter pub get && flutter analyze && flutter test
